services:
  api:
    build:
      context: .
      target: dev # Para reload com --watch
    ports:
      - "8000:8000"
    environment:
      - OTEL_SERVICE_NAME=nina-service
      - OTEL_TRACES_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=console
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    develop:
      watch:
        - action: sync+restart # Copia só os arquivos alterados para dentro do container em execução, sem criar imagem nova
          path: .
          target: /app
          ignore:
            - pyproject.toml
            - uv.lock
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock
